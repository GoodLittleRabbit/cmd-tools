# cmd-tools upload-server 配置示例（包内只读演示）
#
# 复制到以下任一位置后改成你自己的路径 / 主机 / 密码（不要提交密钥）：
#   ./config/upload-server.conf
#   ~/.config/cmd-tools/upload-server.conf
#
# 或临时指定：
#   cmd-tools upload-server --config /path/to/your.conf
#
# 查找顺序: --config → ./config/upload-server.conf → ~/.config/cmd-tools/upload-server.conf → 本文件

CODE_ROOT="YOUR_CODE_ROOT"

# 可选。只有 API 行写成「短名」时才需要。留空则 API 必须写全 jar/module/subdir。
# API_PRESET="yudao"

# id|label|host|user|password|roles(web,api)
SERVERS=(
  "dev|开发机|127.0.0.1|user|CHANGE_ME|web,api"
)

# Web:
#   id|label|web|projectRel|buildCommand|artifactDir|remoteMap[|remoteDirName]
#   remoteDirName 默认为 artifactDir 的目录名（如 dist）
#
# API（推荐写全，不依赖任何框架预设）:
#   id|label|api|projectRel|buildCommand|jarRel|moduleRel|remoteSubdir|remoteMap
#   buildCommand 可留空以跳过构建
#
# API 短名（仅当上方 API_PRESET=yudao）:
#   id|label|api|projectRel|shortName|remoteMap
#
# remoteMap: serverId:/absolute/remote/path   多服务器用 ;; 分隔

SERVICES=(
  "web-app|前端|web|your-web-app|pnpm build|dist|dev:/var/www/your-web-app"
  "api-app|后端|api|your-api|mvn -pl server -am -DskipTests package|server/target/your-api.jar|server|api-server|dev:/opt/your-api"
)
